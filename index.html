<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection Vault</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="script.js"></script>

</head>
<body>


    <header>
        <h1>The Great Sea</h1>
    </header>

    <button id="add-btn">Go Fish!</button>
    <button id="remove-btn">Throw Back to Sea</button>
    <button id="merge-btn">Merge Bucket</button>
    <button id="ran-btn">Mystery Box</button>

    <!-- FILTER BUTTONS -->
    <button id="epic-btn">Filter Epic</button>
    <button id="show-btn">Show All</button>



    <p>Items: <span id="item-count"></span></p>
    <p>Mystery Box: <span id="myst-box"></span></p>
    <p>Mystery Box Tries: <span id="myst-tries"></span></p>
    <p>Total Value: <span id="total-value"></span></p>

    <div id="fish-container"></div>








</body>
</html>
